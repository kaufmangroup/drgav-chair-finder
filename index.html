<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מוצאים לך את הכיסא | ד"ר גב</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen">
    <svg class="chair-draw" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#d21f3c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path pathLength="1" class="cd-part cd-1" d="M74,10 C61,12 55,21 56,33 C57,45 61,51 65,57" />
      <path pathLength="1" class="cd-part cd-2" d="M50,35 L41,49" />
      <path pathLength="1" class="cd-part cd-3" d="M29,57 Q48,61 65,57" />
      <path pathLength="1" class="cd-part cd-4" d="M48,59 L48,92" />
      <path pathLength="1" class="cd-part cd-5" d="M48,93 L20,109 M48,93 L35,113 M48,93 L61,113 M48,93 L76,109" />
      <circle pathLength="1" class="cd-part cd-6" cx="20" cy="109" r="3.2" />
      <circle pathLength="1" class="cd-part cd-6" cx="35" cy="113" r="3.2" />
      <circle pathLength="1" class="cd-part cd-6" cx="61" cy="113" r="3.2" />
      <circle pathLength="1" class="cd-part cd-6" cx="76" cy="109" r="3.2" />
    </svg>
  </div>

  <div id="welcomeScreen" class="welcome-screen" hidden>
    <div class="welcome-decor welcome-decor-top" id="decorTop"></div>
    <div class="welcome-content">
      <img class="welcome-logo" src="assets/logo.png" alt="ד&quot;ר גב">
      <h1>ברוכים הבאים<br>למאתר הכיסא המשרדי</h1>
      <button id="startBtn" class="start-btn" type="button">התחלה</button>
    </div>
    <div class="welcome-decor welcome-decor-bottom" id="decorBottom"></div>
  </div>

  <div id="appScreen" class="app-screen" hidden>
    <header class="brand">
      <img src="assets/logo.png" alt="ד&quot;ר גב">
    </header>

    <main id="stage" class="stage"></main>

    <div class="control-card">
      <div class="control-title">
        זמן ישיבה
        <span class="info-dot" tabindex="0">?
          <span class="info-tooltip">חלק מהכיסאות בנויים לישיבה קצרה, אחרים לישיבה ממושכת לאורך כל היום.</span>
        </span>
      </div>
      <input type="range" id="sittingSlider" min="2" max="8" step="1" value="5" aria-label="כמה שעות ביום אתם יושבים">
      <div class="control-scale">
        <span>2 שעות</span>
        <span>8 שעות</span>
      </div>
      <div class="control-value" id="hoursLabel">כמה שעות ביום</div>
    </div>

    <div class="chair-tooltip" id="chairTooltip" hidden></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
