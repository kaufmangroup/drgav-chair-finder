<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מוצאים לך את הכיסא | ד"ר גב</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen">
    <svg class="chair-draw" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#d21f3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path pathLength="1" class="cd-part cd-1" d="M58,52 L58,22 C58,14 62,10 70,10 L76,10 C83,10 87,14 87,21 L87,45 C87,51 83,55 77,56 L64,57 C60,57 58,55 58,52 Z" />
      <path pathLength="1" class="cd-part cd-2" d="M63,26 L80,26 M63,30 L80,30 M71,30 L71,37" />
      <path pathLength="1" class="cd-part cd-3" d="M55,34 L55,60" />
      <path pathLength="1" class="cd-part cd-4" d="M34,60 C31,60 29,62 29,65 C29,68 31,70 34,70 L82,70 C85,70 87,68 87,65 C87,62 85,60 82,60 Z" />
      <path pathLength="1" class="cd-part cd-5" d="M58,70 L58,91" />
      <path pathLength="1" class="cd-part cd-6" d="M53,91 L63,91 L63,96 L53,96 Z" />
      <path pathLength="1" class="cd-part cd-7" d="M58,96 L36,107 M58,96 L47,111 M58,96 L69,111 M58,96 L80,107" />
      <circle pathLength="1" class="cd-part cd-8" cx="36" cy="107" r="3" />
      <circle pathLength="1" class="cd-part cd-8" cx="47" cy="111" r="3" />
      <circle pathLength="1" class="cd-part cd-8" cx="69" cy="111" r="3" />
      <circle pathLength="1" class="cd-part cd-8" cx="80" cy="107" r="3" />
    </svg>
  </div>

  <div id="welcomeScreen" class="welcome-screen" hidden>
    <div class="welcome-decor welcome-decor-top" id="decorTop"></div>
    <div class="welcome-content">
      <img class="welcome-logo" src="assets/logo.png" alt="ד&quot;ר גב">
      <h1>ברוכים הבאים<br>למאתר הכיסא המשרדי</h1>
      <button id="startBtn" class="start-btn" type="button">התחלה</button>
    </div>
    <div class="welcome-decor welcome-decor-bottom" id="decorBottom"></div>
  </div>

  <div id="appScreen" class="app-screen" hidden>
    <header class="brand">
      <img src="assets/logo.png" alt="ד&quot;ר גב">
    </header>

    <main id="stage" class="stage"></main>

    <div class="control-card">
      <div class="control-title">
        זמן ישיבה
        <span class="info-dot" tabindex="0">?
          <span class="info-tooltip">חלק מהכיסאות בנויים לישיבה קצרה, אחרים לישיבה ממושכת לאורך כל היום.</span>
        </span>
      </div>
      <input type="range" id="sittingSlider" min="2" max="8" step="1" value="5" aria-label="כמה שעות ביום אתם יושבים">
      <div class="control-scale">
        <span>2 שעות</span>
        <span>8 שעות</span>
      </div>
      <div class="control-value" id="hoursLabel">כמה שעות ביום</div>
    </div>

    <div class="chair-tooltip" id="chairTooltip" hidden></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
